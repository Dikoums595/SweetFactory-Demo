<!-- Mermaid : transforme les blocs de code ```mermaid en diagrammes interactifs. -->

  document.addEventListener("DOMContentLoaded", function () {

      mermaid.initialize({ startOnLoad: true, theme: "neutral", securityLevel: "strict" });
    }
  });
</script>
